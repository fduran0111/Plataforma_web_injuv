# Blueprint Render — API FastAPI (INJUV)
# https://render.com/docs/blueprint-spec
#
# Uso: Render Dashboard → New → Blueprint → conectar repo → aplicar.
# Los secretos (JWT_SECRET, DATABASE_URL) se definen en el panel, no en este archivo.

services:
  - type: web
    name: injuv-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn injuv.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: src
      # Cloudflare R2 (archivos subidos). Los valores se cargan en el panel de Render.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: injuv-privado
      - key: R2_PUBLIC_BUCKET
        value: injuv-publico
      - key: R2_PUBLIC_URL
        sync: false
